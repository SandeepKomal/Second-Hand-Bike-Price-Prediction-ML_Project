version: "3.9"

services:
  web:
    build: .
    ports:
      - "5001:80"
    environment:
      DATABASE_URL: "postgresql://myuser:mypassword@db:5432/bike_searches"
      SECRET_KEY: "change-this-to-a-random-secret-key"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: bike_searches
    volumes:
      - bikedb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d bike_searches"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  bikedb_data:
