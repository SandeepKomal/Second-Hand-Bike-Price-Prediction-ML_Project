# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"


version: 2
updates:
  - package-ecosystem: ""
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    ignore:
      # Only suggest patch updates. Rest is manually controlled.
      - dependency-name: "github.com/SandeepKomal/Second-Hand-Bike-Price-Prediction"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Ignore argo-cd altogether. Needs `make update-dependencies` to be done correctly.
      - dependency-name: "github.com/SandeepKomal/Second-Hand-Bike-Price-Prediction"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
